services:
  - type: web
    name: personal-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: dashboard-data
      mountPath: /app/data
      sizeGB: 1
