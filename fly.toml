# fly.toml app configuration file for Personal Dashboard
app = "personal-dashboard"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = "dashboard_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
